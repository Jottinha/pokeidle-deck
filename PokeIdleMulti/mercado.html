<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mercado</title>
<style>
  :root {
    --bg: #0b0c11; --panel: #181a23; --card: #1f2230; --card2: #262a3a; --line: #343850;
    --text: #f2f3f8; --muted: #acb1c5; --faint: #7d8299;
    --accent: #8470ff; --gem: #e879f9; --gem-bg: rgba(232,121,249,.12); --gold: #f5b942; --gold-bg: rgba(245,185,66,.12);
    --ok: #34d378;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { padding: 14px 16px 20px; }
  button, select { font: inherit; color: inherit; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 10px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .grow { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .btn:hover { background: var(--card2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .5; cursor: default; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); user-select: none; }
  .switch i { width: 30px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on i { background: var(--ok); }
  .switch.on i::after { left: 17px; }

  .status { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .status b { color: var(--text); font-weight: 600; }
  .status .warn { color: #facc15; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
  .chips { display: inline-flex; gap: 4px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .tabs { display: flex; gap: 8px; margin-bottom: 0; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 12px 12px 0 0; cursor: pointer;
         background: var(--panel); border: 1px solid var(--line); border-bottom: none; color: var(--muted); font-size: 15px; font-weight: 600; }
  .tab img { width: 20px; height: 20px; }
  .tab .n { font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 999px; background: var(--card2); color: var(--text); }
  .tab.gem.on { color: var(--gem); background: #20172a; border-color: rgba(232,121,249,.55); }
  .tab.gold.on { color: var(--gold); background: #231d12; border-color: rgba(245,185,66,.55); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 0 14px 14px 14px; padding: 12px; }
  section.gem { border-color: rgba(232,121,249,.55); background: #15121b; }
  section.gold { border-color: rgba(245,185,66,.55); background: #16140f; }
  .sub { color: var(--faint); font-size: 12px; margin: 2px 4px 12px; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.alta { background: rgba(52,211,120,.15); color: var(--ok); }
  .badge.media { background: rgba(250,204,21,.15); color: #facc15; }
  .badge.baixa { background: rgba(244,94,80,.15); color: #f45e50; }
  .badge.wait { background: var(--card2); color: var(--muted); }
  .badge.avg { background: transparent; border: 1px dashed var(--line); color: var(--faint); }
  .facts { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .facts b { color: var(--text); font-weight: 600; }

  .card { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; background: var(--card);
          border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: var(--line); background: var(--card2); }
  .icon { width: 44px; height: 44px; border-radius: 10px; background: #12141c; display: grid; place-items: center; grid-row: span 2; }
  .icon img { width: 34px; height: 34px; image-rendering: pixelated; }
  .name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .gem .kind { background: var(--gem-bg); color: var(--gem); }
  .gold .kind { background: var(--gold-bg); color: var(--gold); }
  .flow { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .money { display: inline-flex; align-items: center; gap: 4px; color: var(--text); font-weight: 600; }
  .money img { width: 15px; height: 15px; }
  .arrow { color: var(--faint); }
  .profit { grid-row: span 2; text-align: right; }
  .profit .big { font-size: 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .gem .profit .big { color: var(--gem); }
  .gold .profit .big { color: var(--gold); }
  .profit .big img { width: 18px; height: 18px; }
  .profit .unit { color: var(--faint); font-size: 11px; }
  .pct { display: inline-block; margin-top: 3px; font-size: 12px; font-weight: 600; color: var(--ok); background: rgba(52,211,120,.12);
         padding: 1px 8px; border-radius: 999px; }
  .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--faint); font-size: 12px; }
  .meta .go { margin-left: auto; }
  .go { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; cursor: pointer; color: var(--text); font-size: 12px; }
  .go:hover { background: var(--accent); border-color: var(--accent); }
  .explain { white-space: pre-line; display: none; grid-column: 1 / 4; color: var(--muted); font-size: 13px; background: #161821; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .card.open .explain { display: block; }
  .empty { color: var(--faint); text-align: center; padding: 26px 10px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--line);
           border-radius: 10px; padding: 8px 16px; color: var(--text); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  footer { color: var(--faint); font-size: 12px; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Mercado da Comunidade</h1>
  <div class="grow"></div>
  <label class="ctl">Abrir no jogo em <select id="account"></select></label>
  <span class="switch" id="auto"><i></i>Atualizar a cada 1 min</span>
  <button class="btn primary" id="refresh">Atualizar</button>
</header>
<div class="status" id="status">Lendo o mercado…</div>
<div class="filters">
  <span>Lucro mínimo <span class="chips" id="minPct"></span></span>
  <span>Vendidos em 7 dias <span class="chips" id="minSales"></span></span>
</div>
<div class="tabs">
  <div class="tab gem" data-tab="gem"><img id="gemIcon" alt="">Ganhar gemas <span class="n" id="gemCount">0</span></div>
  <div class="tab gold" data-tab="gold"><img id="goldIcon" alt="">Ganhar coins <span class="n" id="goldCount">0</span></div>
</div>
<section id="panel">
  <p class="sub" id="sub"></p>
  <div id="list"></div>
</section>
<footer>O deck só lê o mercado: ele nunca compra nem anuncia. "Abrir no jogo" leva a conta até o item; a compra é com você.</footer>
<div class="toast" id="toast"></div>

<script>
  const GEM = 'https://pokeidle.io/img/moeda-gema.png';
  const GOLD = 'https://pokeidle.io/assets/site/assets/ui/moeda-ouro.png';
  const FALLBACK = 'https://pokeidle.io/assets/site/assets/ui/menu-bolsa.png';
  document.getElementById('gemIcon').src = GEM;
  document.getElementById('goldIcon').src = GOLD;

  const post = (msg) => window.chrome?.webview?.postMessage(msg);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const br = new Intl.NumberFormat('pt-BR');
  const gems = (v) => (v < 100 ? v.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) : br.format(Math.round(v)));
  const goldShort = (v) => v >= 1e9 ? (v / 1e9).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'B'
    : v >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'M'
    : v >= 1e3 ? (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : br.format(Math.round(v));
  const money = (v, cur) => `<span class="money"><img src="${cur === 'gemas' ? GEM : GOLD}" alt="">${cur === 'gemas' ? gems(v) : goldShort(v)}</span>`;

  let data = null;
  const state = { minPct: 10, minSales: 3, tab: 'gem' };
  try { Object.assign(state, JSON.parse(localStorage.getItem('deckMercado') || '{}')); } catch { }
  const save = () => { try { localStorage.setItem('deckMercado', JSON.stringify(state)); } catch { } };

  function chips(id, values, key, label) {
    const box = $(id);
    box.innerHTML = values.map((v) => `<span class="chip ${state[key] === v ? 'on' : ''}" data-v="${v}">${label(v)}</span>`).join('');
    box.onclick = (e) => {
      const c = e.target.closest('.chip');
      if (!c) return;
      state[key] = Number(c.dataset.v);
      save();
      chips(id, values, key, label);
      render();
    };
  }
  chips('minPct', [0, 5, 10, 20, 50], 'minPct', (v) => v === 0 ? 'qualquer' : v + '%');
  chips('minSales', [1, 3, 10, 30], 'minSales', (v) => v + '+');

  function badge(c) {
    if (c.checked) {
      const cls = c.confidence === 'alta' ? 'alta' : c.confidence === 'média' ? 'media' : 'baixa';
      return `<span class="badge ${cls}" title="Conferido com as vendas reais dos últimos 7 dias e os anúncios de agora">✓ confiança ${esc(c.confidence)}</span>`;
    }
    if (c.checking) return '<span class="badge wait">conferindo…</span>';
    return '<span class="badge avg" title="Só pela média de 7 dias do jogo: as 10 melhores de cada aba são conferidas">pela média do jogo</span>';
  }

  function facts(c) {
    if (!c.checked) return '';
    const cur = c.sellCurrency;
    const sales = c.recentCount
      ? `Vendas reais (7 dias): <b>${br.format(c.recentCount)}</b> · mediana ${money(c.recentMedian, cur)}`
      : '<b>Nenhuma venda real nos últimos 7 dias</b>';
    const comp = c.competitor != null ? `Concorrente mais barato: ${money(c.competitor, cur)}` : 'Ninguém mais vendendo nessa moeda';
    return `<div class="facts"><span>${sales}</span><span>${comp}</span></div>`;
  }

  function card(c) {
    const pct = Math.round(c.percent * 100);
    return `<div class="card ${c.gems ? 'gem' : 'gold'}" data-item="${c.itemId}" data-gems="${c.gems}">
      <div class="icon"><img src="${esc(c.icon || FALLBACK)}" alt="" onerror="this.src='${FALLBACK}'"></div>
      <div class="name"><span>${esc(c.item)}</span><em class="kind">${esc(c.kind)}</em>${badge(c)}</div>
      <div class="profit">
        <div class="big">+${c.gems ? gems(c.profit) : goldShort(c.profit)}<img src="${c.gems ? GEM : GOLD}" alt=""></div>
        <div class="unit">por unidade</div>
        <div class="pct">+${pct}%</div>
      </div>
      <div class="flow">Compre por ${money(c.buy, c.buyCurrency)} <span class="arrow">→</span> revenda por ${money(c.sell, c.sellCurrency)}</div>
      ${facts(c)}
      <div class="meta"><span>${esc(c.note)}</span><span>${br.format(c.sales7d)} vendidos em 7 dias (média do jogo)</span>
        <button class="go" data-open="1">Abrir no jogo ›</button></div>
      <div class="explain">${esc(c.explain)}</div>
    </div>`;
  }

  function render() {
    const gemTab = state.tab !== 'gold';
    for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', (t.dataset.tab === 'gem') === gemTab);
    $('panel').className = gemTab ? 'gem' : 'gold';
    $('sub').textContent = gemTab
      ? 'Termina com mais gemas: revender em gemas, ou comprar com coins e revender em gemas. Lucro em gemas, por unidade.'
      : 'Termina com mais coins: revender em coins, ou comprar com gemas e revender em coins. Lucro em coins, por unidade.';
    if (!data) return;
    const ok = (c) => c.percent * 100 >= state.minPct && c.sales7d >= state.minSales;
    // As conferidas com confiança primeiro; dentro de cada grupo, o maior lucro.
    const rank = (c) => (c.checked ? (c.confidence === 'alta' ? 0 : c.confidence === 'média' ? 1 : 2) : c.checking ? 3 : 4);
    const list = (gems) => data.chances.filter((c) => c.gems === gems && ok(c)).sort((a, b) => rank(a) - rank(b) || b.profit - a.profit);
    const g = list(true), o = list(false);
    $('gemCount').textContent = g.length;
    $('goldCount').textContent = o.length;
    const shown = gemTab ? g : o;
    $('list').innerHTML = shown.length ? shown.map(card).join('')
      : `<div class="empty">Nenhuma oportunidade de ${gemTab ? 'gemas' : 'coins'} com esses filtros agora.</div>`;
  }
  document.querySelector('.tabs').onclick = (e) => {
    const t = e.target.closest('.tab');
    if (!t) return;
    state.tab = t.dataset.tab;
    save();
    render();
  };
  render();

  document.body.addEventListener('click', (e) => {
    const cardEl = e.target.closest('.card');
    if (!cardEl) return;
    if (e.target.closest('[data-open]')) {
      post({ cmd: 'open', itemId: Number(cardEl.dataset.item), gems: cardEl.dataset.gems === 'true', account: Number($('account').value) });
      return;
    }
    cardEl.classList.toggle('open');
  });
  $('refresh').onclick = () => post({ cmd: 'refresh' });
  $('auto').onclick = () => { $('auto').classList.toggle('on'); post({ cmd: 'auto', on: $('auto').classList.contains('on') }); };
  $('account').onchange = () => post({ cmd: 'account', index: Number($('account').value) });

  let toastTimer = 0;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  window.chrome?.webview?.addEventListener('message', (e) => {
    const m = e.data;
    if (m.type === 'busy') { $('refresh').disabled = m.on; $('refresh').textContent = m.on ? 'Lendo…' : 'Atualizar'; return; }
    if (m.type === 'toast') return toast(m.text);
    if (m.type === 'accounts') {
      $('account').innerHTML = m.accounts.map((a) => `<option value="${a.index}" ${a.index === m.selected ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
      return;
    }
    if (m.type === 'status') { $('status').innerHTML = m.html; return; }
    if (m.type === 'data') { data = m; render(); }
  });
  post({ cmd: 'ready' });
</script>
</body>
</html>
